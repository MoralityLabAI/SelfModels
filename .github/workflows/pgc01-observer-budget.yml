name: PGC-01 exact observer budgets

on:
  push:
    branches:
      - research/pgc01-observer-budget-20261126
    paths:
      - 'research/pregeometric_observer/**'
      - '.github/workflows/pgc01-observer-budget.yml'
  pull_request:
    paths:
      - 'research/pregeometric_observer/**'
      - '.github/workflows/pgc01-observer-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: research/pregeometric_observer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaust adaptive policies and check the finite observer
        run: python3 verify_observer.py
      - name: Replay the committed receipt
        run: python3 observer.py --check receipt.json
